<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Validador ITI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="./icons/bb.png" style="height:50px; display: inline-block;">
    <h2>Validação ITI GOV.BR</h2>
    <div class="buttons">
      <button id="abrirEntrada" class="btn blue">📂 Selecionar Pasta Entrada</button>
      <button id="abrirSaida" class="btn green">📂 Selecionar Pasta Saída</button>
      <button id="iniciar" class="btn orange" disabled>▶ Iniciar Validação</button>
    </div>
    <div class="progress-container">
      <progress id="barra" value="0" max="100"></progress>
      <p id="status"><button id="btnAjuda">❓ Ajuda</button></p>

    </div>

  </div>
  <!-- Biblioteca Neutralinojs -->
  <script src="/neutralino.js"></script>
  <!-- Seu script principal -->
  <script src="main.js"></script>
</body>
</html>
